<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOTT — Вход в управление</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-login-page">
  <main class="admin-login-shell">
    <section class="admin-login-card" aria-labelledby="login-title">
      <a class="admin-login-logo" href="/" aria-label="SOTT — вернуться в магазин">
        <img src="/assets/sott-logo.jpg" alt="SOTT">
      </a>
      <p class="admin-eyebrow">Управление магазином</p>
      <h1 id="login-title">Вход в SOTT</h1>
      <p class="admin-muted">Закрытая панель владельца магазина</p>
      <form id="admin-login-form" class="admin-login-form" novalidate>
        <label>
          <span>Логин</span>
          <input id="admin-username" name="username" type="text" autocomplete="username" maxlength="100" required>
        </label>
        <label>
          <span>Пароль</span>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        </label>
        <p class="admin-form-message" id="admin-login-message" role="status" aria-live="polite"></p>
        <button class="admin-primary-button" type="submit">Войти</button>
      </form>
    </section>
  </main>
  <script src="/js/admin-login.js" defer></script>
</body>
</html>
